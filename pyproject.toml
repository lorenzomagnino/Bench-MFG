[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bench-mfg-suite"
version = "0.1.1"
description = "A benchmark suite for Mean Field Game algorithms"
readme = "README.md"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]
keywords = ["mean-field-games", "optimization", "machine-learning", "reinforcement-learning"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "matplotlib>=3.5.0",
    "tqdm>=4.62.0",
    "cma>=3.2.0",
    "colorlog>=6.6.0",
    "hydra-core>=1.3.0",
    "jax>=0.4.13",
    "pyyaml>=6.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
cuda = [
    'jax[cuda12]>=0.4.13; sys_platform == "linux"',
]
cuda12 = [
    'jax[cuda12]>=0.4.13; sys_platform == "linux"',
]
cuda12-local = [
    'jax[cuda12_local]>=0.4.13; sys_platform == "linux"',
]
wandb = [
    "wandb>=0.23.0",
]
rl = [
    "gymnasium>=0.29",
    "stable-baselines3>=2.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "ruff>=0.1.0",
    "pre-commit>=2.20.0",
]
docs = [
    "sphinx>=5.0.0",
    "sphinx-rtd-theme>=1.0.0",
]
jupyter = [
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
    "ipywidgets>=8.0.0",
]

[project.scripts]
benchmfg = "benchmfg.cli:main"
benchmfg-train = "benchmfg.train:main"

[tool.hatch.build.targets.wheel]
packages = ["src/benchmfg"]
artifacts = [
    "src/benchmfg/config/**/*.yaml",
]

[tool.hatch.build.targets.sdist]
include = [
    "/src/benchmfg",
    "/tests",
    "/docs",
    "/README.md",
    "/README_GARNET.md",
    "/EXPERIMENTS.md",
    "/pyproject.toml",
    "/Makefile",
    "/Dockerfile",
    "/conftest.py",
]
exclude = [
    "/outputs",
    "/results",
    "/benchmarks",
    "/profiling_output",
    "/profiling_ouput",
    "/src/benchmfg/results",
    "/.hydra_logs",
    "/dist",
]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Same as Black.
line-length = 88
indent-width = 4

# Assume Python 3.10+
target-version = "py310"

[tool.ruff.lint]
# Enable pycodestyle (`E`) and Pyflakes (`F`) codes by default.
# Also enable:
# - isort (`I`) for import sorting
# - pyupgrade (`UP`) for Python syntax upgrades
# - flake8-bugbear (`B`) for likely bugs and design problems
# - flake8-simplify (`SIM`) for simplification suggestions
# - flake8-comprehensions (`C4`) for comprehension improvements
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "C4"]

ignore = []

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[tool.ruff.lint.isort]
# Sort imports alphabetically within their sections
force-sort-within-sections = true
# Combine multiple `from foo import a, b, c` statements with the same source
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "types-pyyaml>=6.0.12.20260408",
]
